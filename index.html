<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamuna AI - Continuous Voice Chat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
        }
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 1rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background: #ffffff;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        #controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        #start-btn {
            background: #28a745;
            color: white;
        }
        #stop-btn {
            background: #dc3545;
            color: white;
        }
        #status {
            text-align: center;
            padding: 8px;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.3);
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <header>🎙️ ஜமுனா AI - தொடர்ச்சியான குரல் உரையாடல்</header>
    <div id="status">நிலை: தயார். 'ON' அழுத்தவும்</div>
    
    <div id="chat-container" id="chatHistoryBox">
        <div class="message ai-message">வணக்கம்! நான் ஜமுனா. 'ON' கொடுத்த பிறகு என்னிடம் தொடர்ந்து பேசலாம்; ஒவ்வொரு முறையும் பட்டன் அழுத்தத் தேவையில்லை!</div>
    </div>

    <div id="controls">
        <button id="start-btn" onclick="startChat()">ON (தொடங்கு)</button>
        <button id="stop-btn" onclick="stopChat()">OFF (நிறுத்து)</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const statusDiv = document.getElementById('status');
        let recognition;
        let active = false;

        const GEMINI_API_KEY = "AQ.Ab8RN6K0rq00yE-ZAA9uILkZDdMbcy4CHbXcU0Zg1I8Aq2dYCA";

        function addMsg(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender === 'user' ? 'user-message' : 'ai-message'}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            // சேட் ஹிஸ்டரியை போனில் சேமிக்க
            localStorage.setItem('jamuna_chat_history', chatContainer.innerHTML);
            return div;
        }

        // பக்கம் திறக்கும்போது பழைய சேட் இருந்தால் காட்ட
        window.onload = function() {
            const savedChat = localStorage.getItem('jamuna_chat_history');
            if(savedChat) {
                chatContainer.innerHTML = savedChat;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        };

        function speak(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'ta-IN';
                utter.pitch = 0.9;
                utter.rate = 1.0;
                
                utter.onend = function() {
                    if (callback) callback();
                };
                window.speechSynthesis.speak(utter);
            } else {
                if (callback) callback();
            }
        }

        async function processQuery(query) {
            statusDiv.innerText = "நிலை: ஜமுனா யோசிக்கிறது...";
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: "நீங்கள் ஜமுனா என்ற குரல் உதவியாளர். பயனர் கேட்கும் கேள்விக்கு தமிழில் சுருக்கமாக, தெளிவாக மற்றும் இயல்பாகப் பதிலளியுங்கள். கேள்வி: " + query
                            }]
                        }]
                    })
                });

                const data = await response.json();
                let reply = "";

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    reply = data.candidates[0].content.parts[0].text;
                } else {
                    reply = "மன்னிக்கவும், என்னால் இப்போது பதிலளிக்க முடியவில்லை.";
                }

                addMsg(reply, 'ai');
                
                // பதில் பேசி முடித்ததும் தானாகவே அடுத்த குரலைக் கேட்க ஆரம்பிக்கும்
                speak(reply, () => {
                    if (active) {
                        setTimeout(listenVoice, 500);
                    }
                });

            } catch (error) {
                let errReply = "நெட்வொர்க் இணைப்புச் சிக்கல். மீண்டும் பேசவும்.";
                addMsg(errReply, 'ai');
                speak(errReply, () => {
                    if (active) setTimeout(listenVoice, 500);
                });
            }
        }

        function listenVoice() {
            if (!active) return;
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                alert("உங்கள் பிரவுசர் குரல் உள்ளீட்டை ஆதரிக்கவில்லை.");
                return;
            }

            recognition = new SpeechRec();
            recognition.lang = 'ta-IN';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                statusDiv.innerText = "நிலை: உங்களைக் கவனமாகக் கேட்டுக்கொண்டிருக்கிறது... பேசுங்கள்!";
            };

            recognition.onresult = function(e) {
                const text = e.results[0][0].transcript;
                addMsg(text, 'user');
                processQuery(text);
            };

            recognition.onerror = function() {
                if (active) {
                    setTimeout(listenVoice, 1000);
                }
            };

            recognition.onend = function() {
                // ஒருவேளை நடுவில் நின்றால் ஆட்டோமேட்டிக்காகத் தொடர
            };

            try {
                recognition.start();
            } catch(err) {
                console.log(err);
            }
        }

        function startChat() {
            if (active) return;
            active = true;
            statusDiv.innerText = "நிலை: உரையாடல் தொடங்கியது...";
            listenVoice();
        }

        function stopChat() {
            active = false;
            if (recognition) recognition.stop();
            window.speechSynthesis.cancel();
            statusDiv.innerText = "நிலை: நிறுத்தப்பட்டது.";
        }
    </script>
</body>
</html>
