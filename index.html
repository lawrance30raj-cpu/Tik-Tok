<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamuna AI - குரல் உதவியாளர்</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1b2a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1b263b;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid #415a77;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 15px;
            font-size: 1rem;
            line-height: 1.5;
        }
        .user-message {
            background-color: #0077b6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #415a77;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        #controls {
            padding: 20px;
            background-color: #1b263b;
            display: flex;
            gap: 15px;
            justify-content: center;
            border-top: 2px solid #415a77;
        }
        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            color: white;
        }
        #start-btn {
            background-color: #2b9348;
        }
        #stop-btn {
            background-color: #d90429;
        }
    </style>
</head>
<body>

    <header>ஜமுனா AI - குரல் உதவியாளர்</header>

    <div id="chat-container">
        <div class="message ai-message">வணக்கம்! நான் ஜமுனா. புதிய API Key இணைக்கப்பட்டுள்ளது. பேசுங்கள்!</div>
    </div>

    <div id="controls">
        <button id="start-btn" onclick="startListening()">ON (தொடங்கு)</button>
        <button id="stop-btn" onclick="stopListening()">OFF (நிறுத்து)</button>
    </div>

    <script>
        // உங்களது API Key நேரடியாக இங்கே இணைக்கப்பட்டுள்ளது
        const apiKey = "AQ.Ab8RN6Iu93A3f4TWcc85GLmb8FaEvNnPBk2gJo1NGiCmtbNjYQ";
        
        const chatContainer = document.getElementById('chat-container');

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(sender === 'user' ? 'user-message' : 'ai-message');
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function callGeminiAPI(promptText) {
            appendMessage(promptText, 'user');
            appendMessage("ஜமுனா சிந்தித்துக்கொண்டிருக்கிறது...", 'ai');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                
                // கடைசியாக வந்த "சிந்தித்துக்கொண்டிருக்கிறது..." என்ற மெசேஜை நீக்குதல்
                chatContainer.removeChild(chatContainer.lastChild);

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage(aiReply, 'ai');
                    speakText(aiReply);
                } else {
                    appendMessage("மன்னிக்கவும், என்னால் பதில் அளிக்க முடியவில்லை.", 'ai');
                }
            } catch (error) {
                chatContainer.removeChild(chatContainer.lastChild);
                appendMessage("ஏபிஐ பிழை: " + error.message, 'ai');
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ta-IN';
                window.speechSynthesis.speak(utterance);
            }
        }

        // குரல் உள்ளீடு (Speech Recognition) அமைப்பு
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ta-IN';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                callGeminiAPI(transcript);
            };

            recognition.onerror = function(event) {
                console.error("Speech recognition error", event.error);
            };
        } else {
            alert("உங்கள் பிரவுசர் குரல் உள்ளீட்டை ஆதரிக்கவில்லை.");
        }

        function startListening() {
            if (recognition) {
                try {
                    recognition.start();
                } catch (e) {
                    console.log("Already started");
                }
            }
        }

        function stopListening() {
            if (recognition) {
                recognition.stop();
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }
    </script>
</body>
</html>
