<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamuna AI - Voice Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 1rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background: #ffffff;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        #controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        #start-btn {
            background: #28a745;
            color: white;
        }
        #stop-btn {
            background: #dc3545;
            color: white;
        }
        button:active {
            transform: scale(0.95);
        }
        #status {
            text-align: center;
            padding: 8px;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <header>🎙️ ஜமுனா AI உதவி</header>
    <div id="status">நிலை: தயார் நிலையில் உள்ளது</div>
    
    <div id="chat-container">
        <div class="message ai-message">வணக்கம்! நான் ஜமுனா. நீங்கள் என்னிடம் என்ன கேள்வி வேண்டுமானாலும் கேட்கலாம், இணையத்தில் தேடிப் பதில் அளிக்கிறேன்.</div>
    </div>

    <div id="controls">
        <button id="start-btn" onclick="startListening()">ON (தொடங்கு)</button>
        <button id="stop-btn" onclick="stopListening()">OFF (நிறுத்து)</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const statusDiv = document.getElementById('status');
        let recognition;
        let isListening = false;

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(sender === 'user' ? 'user-message' : 'ai-message');
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ta-IN';
                
                const voices = window.speechSynthesis.getVoices();
                const maleVoice = voices.find(v => v.name.includes('Male') || v.name.includes('Rishi') || v.name.includes('Valluvar') || v.lang.includes('ta'));
                if (maleVoice) {
                    utterance.voice = maleVoice;
                }
                
                utterance.pitch = 0.85; // ஆழமான ஆண் குரல்
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function searchAndAnswer(query) {
            statusDiv.innerText = "நிலை: இணையத்தில் தேடுகிறது...";
            const tempMessage = appendMessage("இணையத்தில் தகவல் தேடப்படுகிறது...", 'ai');
            
            try {
                // விக்கிபீடியா & திறந்தநிலை API மூலம் நேரடி இணையத் தேடல் (Live Internet Search)
                const searchUrl = `https://ta.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`;
                const response = await fetch(searchUrl);
                const data = await response.json();
                
                let answerText = "";
                
                if (data.query && data.query.search && data.query.search.length > 0) {
                    // தேடல் முடிவிலிருந்துHTML டேகுகளை நீக்கி சுத்தமான உரையைப் பெறுதல்
                    let rawSnippet = data.query.search[0].snippet;
                    let cleanSnippet = rawSnippet.replace(/<\/?[^>]+(>|$)/g, "");
                    answerText = cleanSnippet;
                } else {
                    // தமிழ் முடிவுகள் இல்லையெனில் ஆங்கில விக்கிபீடியாவில் தேடி விடை எடுத்தல்
                    const enUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`;
                    const enResponse = await fetch(enUrl);
                    const enData = await enResponse.json();
                    
                    if (enData.query && enData.query.search && enData.query.search.length > 0) {
                        let cleanEnSnippet = enData.query.search[0].snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        answerText = "தகவல்: " + cleanEnSnippet;
                    } else {
                        answerText = "மன்னிக்கவும், நீங்கள் கேட்ட '" + query + "' பற்றிய தகவல் இணையத்தில் உடனடியாகக் கிடைக்கவில்லை.";
                    }
                }

                tempMessage.innerText = answerText;
                statusDiv.innerText = "நிலை: பதிலளிக்கிறது...";
                speak(answerText);

            } catch (error) {
                tempMessage.innerText = "மன்னிக்கவும், இணையத் தேடலின் போது சிறிய பிழை ஏற்பட்டது. மீண்டும் முயற்சிக்கவும்.";
                speak(tempMessage.innerText);
            } finally {
                setTimeout(() => {
                    if (!isListening) statusDiv.innerText = "நிலை: தயார் நிலையில் உள்ளது";
                }, 2000);
            }
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("உங்கள் பிரவுசர் குரல் உள்ளீட்டை ஆதரிக்கவில்லை.");
                return;
            }

            if (isListening) return;

            recognition = new SpeechRecognition();
            recognition.lang = 'ta-IN';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                isListening = true;
                statusDiv.innerText = "நிலை: கேட்டுக் கொண்டிருக்கிறது...";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                appendMessage(speechResult, 'user');
                searchAndAnswer(speechResult);
            };

            recognition.onerror = function(event) {
                statusDiv.innerText = "நிலை: குரலைப் புரிந்துகொள்வதில் பிழை.";
                isListening = false;
            };

            recognition.onend = function() {
                isListening = false;
            };

            try {
                recognition.start();
            } catch (e) {
                console.log(e);
            }
        }

        function stopListening() {
            if (recognition) {
                recognition.stop();
            }
            isListening = false;
            statusDiv.innerText = "நிலை: நிறுத்தப்பட்டது";
            window.speechSynthesis.cancel();
        }

        // குரல்கள் சரியாக லோட் ஆவதை உறுதி செய்ய
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }
    </script>
</body>
</html>
