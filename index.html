<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamuna AI - Voice Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
        }
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 1rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background: #ffffff;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        #controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        #start-btn {
            background: #28a745;
            color: white;
        }
        #stop-btn {
            background: #dc3545;
            color: white;
        }
        #status {
            text-align: center;
            padding: 8px;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.3);
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <header>🎙️ ஜமுனா AI - நேரடி இணையத் தேடல்</header>
    <div id="status">நிலை: தயார் நிலையில் உள்ளது. 'ON' அழுத்தவும்.</div>
    
    <div id="chat-container">
        <div class="message ai-message">வணக்கம்! நான் ஜமுனா. ஆன் செய்துவிட்டு என்னிடம் எதைக் கேட்டாலும் இன்டர்நெட்டில் தேடிப் பதிலளிக்கிறேன்!</div>
    </div>

    <div id="controls">
        <button id="start-btn" onclick="startChat()">ON (தொடங்கு)</button>
        <button id="stop-btn" onclick="stopChat()">OFF (நிறுத்து)</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const statusDiv = document.getElementById('status');
        let recognition;
        let active = false;

        function addMsg(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender === 'user' ? 'user-message' : 'ai-message'}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function speak(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'ta-IN';
                utter.pitch = 0.9;
                utter.rate = 1.0;
                
                utter.onend = function() {
                    if (callback) callback();
                };
                window.speechSynthesis.speak(utter);
            } else {
                if (callback) callback();
            }
        }

        async function processQuery(query) {
            statusDiv.innerText = "நிலை: இணையத்தில் தேடுகிறது...";
            let q = query.toLowerCase().trim();
            let reply = "";

            if (q.includes('பெயர்') || q.includes('name')) {
                reply = "என் பெயர் ஜமுனா. உங்களோடு பேசவும் தகவல்களைத் தேடவும் உருவாக்கப்பட்ட உதவியாளர்.";
            } else if (q.includes('எப்படி இருக்க') || q.includes('how are you')) {
                reply = "நான் ரொம்ப நல்லா இருக்கேன்! உங்களுக்கு என்ன தகவல் வேண்டும்?";
            } else if (q.includes('வணக்கம்') || q.includes('ஹலோ') || q.includes('hi')) {
                reply = "வணக்கம்! சொல்லுங்கள், என்ன தேட வேண்டும்?";
            } else {
                try {
                    // இணையத்திலிருந்து நேரடித் தேடல்
                    const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1`);
                    const data = await res.json();

                    if (data.AbstractText && data.AbstractText !== "") {
                        reply = data.AbstractText;
                    } else {
                        // விக்கிபீடியா காப்புத் தேடல்
                        const wikiRes = await fetch(`https://ta.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`);
                        const wikiData = await wikiRes.json();
                        
                        if (wikiData.query && wikiData.query.search.length > 0) {
                            reply = wikiData.query.search[0].snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        } else {
                            reply = "மன்னிக்கவும், நீங்கள் கேட்ட '" + query + "' பற்றிய தகவல் இணையத்தில் உடனடியாகக் கிடைக்கவில்லை.";
                        }
                    }
                } catch(e) {
                    reply = "இணைய இணைப்பில் சிறிய தாமதம். மீண்டும் சொல்லுங்கள்.";
                }
            }

            addMsg(reply, 'ai');
            speak(reply, () => {
                if (active) listenVoice();
            });
        }

        function listenVoice() {
            if (!active) return;
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                alert("உங்கள் பிரவுசர் குரல் உள்ளீட்டை ஆதரிக்கவில்லை.");
                return;
            }

            recognition = new SpeechRec();
            recognition.lang = 'ta-IN';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                statusDiv.innerText = "நிலை: உங்களைக் கவனமாகக் கேட்டுக்கொண்டிருக்கிறது...";
            };

            recognition.onresult = function(e) {
                const text = e.results[0][0].transcript;
                addMsg(text, 'user');
                processQuery(text);
            };

            recognition.onerror = function() {
                if (active) setTimeout(listenVoice, 1000);
            };

            try {
                recognition.start();
            } catch(err) {
                console.log(err);
            }
        }

        function startChat() {
            if (active) return;
            active = true;
            statusDiv.innerText = "நிலை: உரையாடல் தொடங்கியது...";
            listenVoice();
        }

        function stopChat() {
            active = false;
            if (recognition) recognition.stop();
            window.speechSynthesis.cancel();
            statusDiv.innerText = "நிலை: நிறுத்தப்பட்டது.";
        }
    </script>
</body>
</html>
