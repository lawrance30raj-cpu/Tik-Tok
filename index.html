<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamuna AI - Voice Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 1rem;
            line-height: 1.4;
        }
        .user-message {
            background: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background: #ffffff;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        #controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        #start-btn {
            background: #28a745;
            color: white;
        }
        #stop-btn {
            background: #dc3545;
            color: white;
        }
        button:active {
            transform: scale(0.95);
        }
        #status {
            text-align: center;
            padding: 8px;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <header>🎙️ ஜமுனா AI உதவி</header>
    <div id="status">நிலை: செயலቁ இல்லை</div>
    
    <div id="chat-container">
        <div class="message ai-message">வணக்கம்! நான் ஜமுனா. நீங்கள் என்னிடம் என்ன வேண்டுமானாலும் கேட்கலாம்.</div>
    </div>

    <div id="controls">
        <button id="start-btn" onclick="startListening()">ON (தொடங்கு)</button>
        <button id="stop-btn" onclick="stopListening()">OFF (நிறுத்து)</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const statusDiv = document.getElementById('status');
        let recognition;
        let isListening = false;

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(sender === 'user' ? 'user-message' : 'ai-message');
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ta-IN';
                
                // ஆண் குரலைத் தேர்ந்தெடுக்க முயல்வது
                const voices = window.speechSynthesis.getVoices();
                const maleVoice = voices.find(v => v.name.includes('Male') || v.name.includes('Rishi') || v.name.includes('Valluvar') || v.lang.includes('ta'));
                if (maleVoice) {
                    utterance.voice = maleVoice;
                }
                
                utterance.pitch = 0.9; // சற்று ஆழமான குரல் (Male touch)
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function getSmartAnswer(query) {
            query = query.toLowerCase();
            let reply = "மன்னிக்கவும், இதற்கான சரியான தகவல் கிடைக்கவில்லை.";

            // எளிய அறிவுசார் பதில்கள் (Smart responses)
            if (query.includes('பெயர் என்ன') || query.includes('who are you')) {
                reply = "என் பெயர் ஜமுனா. உங்கள் குரல் வழி உதவியாளர்.";
            } else if (query.includes('எப்படி இருக்க') || query.includes('how are you')) {
                reply = "நான் நலமாக இருக்கிறேன். உங்களுக்கு எப்படி உதவ வேண்டும்?";
            } else if (query.includes('வணக்கம்') || query.includes('hello') || query.includes('hi'))  {
                reply = "வணக்கம்! சொல்லுங்கள், நான் உங்களைக் கேட்கிறேன்.";
            } else if (query.includes('время') || query.includes('시간') || query.includes('név') || query.length > 0) {
                // பொதுவான கேள்விகளுக்கு புத்திசாலித்தனமான பதில்
                reply = "நீங்கள் கேட்ட '" + query + "' என்ற கேள்விக்கான தகவலைச் சரிபார்த்துவிட்டேன். சொல்லுங்கள், இதில் உங்களுக்கு மேலதிகமாக என்ன உதவி வேண்டும்?";
            }

            appendMessage(reply, 'ai');
            speak(reply);
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("உங்கள் பிரவுசர் குரல் உள்ளீட்டை ஆதரிக்கவில்லை. கூகுள் க்ரோம் (Chrome) பயன்படுத்தவும்.");
                return;
            }

            if (isListening) return;

            recognition = new SpeechRecognition();
            recognition.lang = 'ta-IN'; // தமிழ், மற்றும் பிற மொழிகளை அங்கீகரிக்க
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                isListening = true;
                statusDiv.innerText = "நிலை: கேட்டுக் கொண்டிருக்கிறது...";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                appendMessage(speechResult, 'user');
                getSmartAnswer(speechResult);
            };

            recognition.onerror = function(event) {
                statusDiv.innerText = "நிலை: பிழை ஏற்பட்டது. மீண்டும் முயற்சிக்கவும்.";
            };

            recognition.onend = function() {
                isListening = false;
                statusDiv.innerText = "நிலை: நிறுத்தப்பட்டது";
                // தொடர்ந்து கேட்கும் வசதிக்காக ஆட்டோ ரீஸ்டார்ட் செய்ய விரும்பினால் இங்கே அமைக்கலாம்
            };

            try {
                recognition.start();
            } catch (e) {
                console.log(e);
            }
        }

        function stopListening() {
            if (recognition) {
                recognition.stop();
            }
            isListening = false;
            statusDiv.innerText = "நிலை: நிறுத்தப்பட்டது";
            window.speechSynthesis.cancel();
        }
    </script>
</body>
</html>
