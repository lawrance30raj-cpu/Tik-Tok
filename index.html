<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamuna AI - Voice Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #134e5e, #71b280);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
        }
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 1rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background: #ffffff;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        #controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        #start-btn {
            background: #28a745;
            color: white;
        }
        #stop-btn {
            background: #dc3545;
            color: white;
        }
        #status {
            text-align: center;
            padding: 8px;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.2);
            color: #ffeb3b;
        }
    </style>
</head>
<body>

    <header>🎙️ ஜமுனா AI - இயல்பான உரையாடல்</header>
    <div id="status">நிலை: ஆன் செய்ய 'ON' அழுத்தவும்</div>
    
    <div id="chat-container">
        ...
        <div class="message ai-message">வணக்கம்! நான் ஜமுனா. நீங்கள் என்னிடம் சாதாரணமாய் பேசுவது போல எதைக் கேட்டாலும் நான் பதிலளிக்கிறேன். சொல்லுங்கள்!</div>
    </div>

    <div id="controls">
        <button id="start-btn" onclick="startChat()">ON (தொடங்கு)</button>
        <button id="stop-btn" onclick="stopChat()">OFF (நிறுத்து)</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const statusDiv = document.getElementById('status');
        let recognition;
        let active = false;

        function addMsg(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender === 'user' ? 'user-message' : 'ai-message'}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function speak(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'ta-IN';
                utter.pitch = 0.9;
                utter.rate = 1.0;
                
                utter.onend = function() {
                    if (callback) callback();
                };
                window.speechSynthesis.speak(utter);
            } else {
                if (callback) callback();
            }
        }

        async function processQuery(query) {
            statusDiv.innerText = "நிலை: யோசித்து பதிலளிக்கிறது...";
            
            // பொதுவான மற்றும் இயல்பான உரையாடல் பதில்கள்
            let q = query.toLowerCase();
            let reply = "";

            if (q.includes('பெயர்') || q.includes('who are you')) {
                reply = "என் பெயர் ஜமுனா. உங்களோடு பேசத்தான் நான் இருக்கேன்.";
            } else if (q.includes('எப்படி இருக்க') || q.includes('how are you')) {
                reply = "நான் சூப்பரா இருக்கேன்! நீங்கள் எப்படி இருக்கீங்க? சொல்லுங்க என்ன விஷயம்?";
            } else if (q.includes('சாப்பிட்டீங்களா') || q.includes('சாப்பாடு')) {
                reply = "நான் ஒரு AI அசிஸ்டன்ட், எனக்கு சாப்பாடெல்லாம் தேவையில்லை தோழா! நீங்க சாப்பிட்டீங்களா?";
            } else if (q.includes('வணக்கம்') || q.includes('ஹலோ') || q.includes('hi')) {
                reply = "வணக்கம்! சொல்லுங்க, என்னைப் பற்றி என்ன தெரிஞ்சிக்கணும்?";
            } else {
                // இணையத்தில் தேடி பதitsu தருவது
                try {
                    const res = await fetch(`https://ta.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`);
                    const data = await res.json();
                    if (data.query && data.query.search.length > 0) {
                        reply = data.query.search[0].snippet.replace(/<\/?[^>]+(>|$)/g, "");
                    } else {
                        reply = "நீங்கள் சொன்ன '" + query + "' பத்தி எனக்குப் புரியும் வகையில சொல்லுங்க, இல்லனா வேற ஏதாவது கேளுங்க.";
                    }
                } catch(e) {
                    reply = "மன்னிக்கவும், நெட்வொர்க் ஸ்லோவா இருக்கு. திரும்பவும் சொல்லுங்க.";
                }
            }

            addMsg(reply, 'ai');
            speak(reply, () => {
                if (active) listenVoice();
            });
        }

        function listenVoice() {
            if (!active) return;
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                alert("உங்கள் பிரவுசர் குரலை ஆதரிக்கவில்லை.");
                return;
            }

            recognition = new SpeechRec();
            recognition.lang = 'ta-IN';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                statusDiv.innerText = "நிலை: உங்களைக் கவனமாகக் கேட்டுக்கொண்டிருக்கிறது...";
            };

            recognition.onresult = function(e) {
                const text = e.results[0][0].transcript;
                addMsg(text, 'user');
                processQuery(text);
            };

            recognition.onerror = function() {
                if (active) setTimeout(listenVoice, 1000);
            };

            try {
                recognition.start();
            } catch(err) {
                console.log(err);
            }
        }

        function startChat() {
            if (active) return;
            active = true;
            statusDiv.innerText = "நிலை: உரையாடல் தொடங்கியது...";
            listenVoice();
        }

        function stopChat() {
            active = false;
            if (recognition) recognition.stop();
            window.speechSynthesis.cancel();
            statusDiv.innerText = "நிலை: நிறுத்தப்பட்டது.";
        }
    </script>
</body>
</html>
